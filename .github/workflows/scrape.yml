name: Daily RCE Australia Scrape

# -------------------------------------------------
# 1️⃣  Triggers
# -------------------------------------------------
on:
  schedule:
    # every day at 06:00 UTC (≈ 16:00 AEST)
    - cron: "0 6 * * *"
  workflow_dispatch:                # manual run button

# -------------------------------------------------
# 2️⃣  Job
# -------------------------------------------------
jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # 2.1  Checkout – ensure we have a real branch
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # keep the auth token so we can push later
          persist-credentials: ***
          # use the branch that GitHub Pages serves from
          # (change to `main` if your site is published from the default branch)
          ref: main               # <-- adjust if you publish from another branch

      # -------------------------------------------------
      # 2.2  Set up Python 3.12
      # -------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------------------------------
      # 2.3  Install scraper dependencies
      # -------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --quiet requests beautifulsoup4

      # -------------------------------------------------
      # 2.4  Run the scraper (creates/updates data/events.json)
      # -------------------------------------------------
      - name: Run scraper
        run: |
          python scraper/scraper.py

      # -------------------------------------------------
      # 2.5  Configure Git user (uses the default GITHUB_TOKEN)
      # -------------------------------------------------
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # -------------------------------------------------
      # 2.6  Stage the new/changed JSON file
      # -------------------------------------------------
      - name: Stage events.json
        run: |
          git add data/events.json

      # -------------------------------------------------
      # 2.7  Commit only if there are changes
      # -------------------------------------------------
      - name: Commit changes
        id: commit
        run: |
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            git commit -m "🤖 Update Australian RCE events (auto‑scrape)"
          echo "no_changes=false" >> $GITHUB_OUTPUT
          fi

      # -------------------------------------------------
      # 2.8  Push back to the publishing branch
      # -------------------------------------------------
      - name: Push changes
        if: steps.commit.outputs.no_changes == 'false'
        run: |
          git push origin HEAD:${{ github.ref }}