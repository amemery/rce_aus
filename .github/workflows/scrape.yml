name: Daily RCE Australia Scrape

# -------------------------------------------------------------------------
# 1️⃣  Triggers
# -------------------------------------------------------------------------
on:
  schedule:
    # Runs every day at 06:00 UTC (≈ 16:00 AEST)
    - cron: "0 6 * * *"
  workflow_dispatch:            # manual “Run workflow” button

# -------------------------------------------------------------------------
# 2️⃣  Jobs
# -------------------------------------------------------------------------
jobs:
  scrape:
    runs-on: ubuntu-latest

    # ---------------------------------------------------------------------
    # 2.1  Checkout, set up Python
    # ---------------------------------------------------------------------
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # fetch the full history – needed for a commit later
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -----------------------------------------------------------------
      # 2.2  Install scraper dependencies
      # -----------------------------------------------------------------
      - name: Install deps (requests & beautifulsoup4)
        run: |
          python -m pip install --quiet requests beautifulsoup4

      # -----------------------------------------------------------------
      # 2.3  Run the scraper
      # -----------------------------------------------------------------
      - name: Run scraper
        run: |
          python scraper/scraper.py

      # -----------------------------------------------------------------
      # 2.4  Commit the updated events.json (if it changed)
      # -----------------------------------------------------------------
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Detect changes
        id: changes
        run: |
          git diff --quiet data/events.json || echo "changed=1" >> $GITHUB_OUTPUT

      - name: Commit & push changes
        if: steps.changes.outputs.changed == '1'
        run: |
          git add data/events.json
          git commit -m "🤖 Update Australian RCE events (auto‑scrape)"
          git push origin HEAD:${{ github.ref }}

      # -----------------------------------------------------------------
      # 2.5  (Optional) Invalidate GitHub Pages cache
      # -----------------------------------------------------------------
      # If you serve the site from the same branch, GitHub Pages rebuilds
      # automatically on each push. No extra step is required.