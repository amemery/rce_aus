name: Daily RCE Australia Scrape

# The built-in GITHUB_TOKEN with contents:write is enough to push events.json.
permissions:
  contents: write

on:
  schedule:
    - cron: "0 20 * * *"         # 20:00 UTC = 06:00 Brisbane
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: python -m pip install --quiet -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scraper.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "🤖 Update Australian RCE events (auto-scrape)"
          # registered.json may have been committed from the site meanwhile
          git pull --rebase origin main
          git push origin HEAD:main
