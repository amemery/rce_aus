<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Australian RCE Events</title>
  <link rel="stylesheet" href="style.css">
  <!-- FullCalendar v6 injects its own CSS; there is no separate stylesheet. -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="calendar.js" defer></script>
  <script src="list.js" defer></script>
</head>
<body>
  <h1>🇦🇺 Australian Robot Combat Events</h1>

  <p id="admin-banner" class="banner" hidden>
    Admin mode – changes are committed to GitHub.
    <a href="?admin=logout">Forget token</a>
  </p>
  <p id="status" class="banner error" role="alert" hidden></p>

  <section id="calendar"></section>

  <h2>Event List</h2>
  <ul id="event-list"></ul>

  <footer>Data from <a href="https://www.robotcombatevents.com" target="_blank" rel="noopener">robotcombatevents.com</a>, refreshed daily.</footer>
</body>
</html>
